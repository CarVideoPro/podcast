<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Video Pro - Horizontal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- TEMEL AYARLAR --- */
        html, body {
            width: 100%; height: 100%; overflow: hidden; background-color: #000;
            overscroll-behavior: none; /* Ekstra güvenlik */
        }

        /* Default Root Font Size */
        html { font-size: 16px; transition: font-size 0.2s ease; }

        /* Scrollbar (Yatay İçin) */
        ::-webkit-scrollbar { height: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 2px; }

        /* --- VIDEO WRAPPER (TAM EKRAN OTURUM) --- */
        .video-wrapper {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        video {
            object-fit: contain !important;
            width: 100% !important; height: 100% !important;
            background-color: #000 !important;
        }
        video:fullscreen { object-fit: contain !important; background-color: #000 !important; }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- YATAY KANAL KARTLARI --- */
        #channelList {
            display: flex;
            flex-direction: row; /* Yan yana dizilim */
            overflow-x: auto; /* Yatay kaydırma */
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            padding: 0.5rem;
            background: #111827; /* Gri arka plan */
            gap: 0.5rem;
            align-items: center;
        }

        .channel-item {
            flex-shrink: 0; /* Küçülmeyi engelle */
            width: 240px; /* Sabit genişlik */
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .channel-item:active { transform: scale(0.95); }
        
        .active-channel { 
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%) !important; 
            color: white !important; border: 1px solid #ffaaaa !important;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5); font-weight: bold;
        }
        .active-channel i { color: white !important; }

        /* Favori İkonu */
        .fav-btn { z-index: 10; padding: 8px; transition: transform 0.2s; }
        .fav-btn:active { transform: scale(1.2); }
        .is-favorite { color: #ef4444 !important; }

        /* --- ÜLKE MENÜSÜ (GRID) --- */
        #countryOverlay {
            backdrop-filter: blur(15px); background-color: rgba(10, 10, 10, 0.98);
        }
        .country-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #1f2937; border: 1px solid #374151; border-radius: 12px;
            padding: 1rem; cursor: pointer; transition: all 0.2s;
        }
        .country-card:active { transform: scale(0.95); background: #374151; }
        .country-flag { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .country-name { font-size: 0.8rem; font-weight: bold; color: #d1d5db; text-align: center; }

        /* Marquee */
        .marquee-container {
            overflow: hidden; white-space: nowrap; position: relative;
            background: #0f172a; border-top: 1px solid #1e293b; border-bottom: 1px solid #1e293b;
        }
        .marquee-content {
            display: inline-block; padding-left: 100%;
            animation: marquee 35s linear infinite;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-black text-white">

                <button onclick="changeZoom(-1)" class="w-8 h-8 flex items-center justify-center bg-gray-800 rounded-full hover:bg-gray-700"><i class="fas fa-minus text-xs"></i></button>
                <button onclick="changeZoom(1)" class="w-8 h-8 flex items-center justify-center bg-gray-800 rounded-full hover:bg-gray-700"><i class="fas fa-plus text-xs"></i></button>
                <button onclick="toggleFullScreen()" class="w-8 h-8 flex items-center justify-center bg-red-600 rounded-full hover:bg-red-700 text-white ml-2"><i class="fas fa-expand text-xs"></i></button>
            </div>
        </div>

        <div class="h-6 flex items-center marquee-container">
            <div class="marquee-content font-bold text-xs tracking-wider text-gray-300 flex items-center">
                <span class="mx-4 text-red-500">CAR VIDEO PRO</span> 
                <i class="fab fa-telegram mx-2 text-blue-400"></i> t.me/car_video_pro 
                <span class="mx-6 text-gray-600">|</span> 
                <i class="fab fa-telegram mx-2 text-blue-400"></i> t.me/aacarvideopro

            </div>
        </div>
    </header>

    <main class="flex-1 relative bg-black w-full min-h-0">
        <div id="playerWrapper" class="video-wrapper">
            
            <div id="countryOverlay" class="absolute inset-0 z-[100] hidden overflow-y-auto p-4 flex flex-col">
                <div class="flex justify-end mb-4 sticky top-0 z-10">
                    <button onclick="toggleCountryMenu()" class="bg-red-600 text-white px-4 py-2 rounded-full shadow-lg font-bold">

                    </button>
                </div>
                <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 pb-20" id="countryGrid">
                    </div>
            </div>

            <div id="placeholderContent" class="absolute inset-0 flex items-center justify-center text-gray-700 flex-col bg-gray-900">
                <i class="fas fa-play-circle text-8xl mb-6 opacity-20"></i>
                <p class="text-lg opacity-40 font-light">Select a Channel Below</p>
                <h2 id="currentChannelTitle" class="text-xl font-bold text-red-600 mt-4">Waiting...</h2>
            </div>
        </div>
        
        <div id="statusMessage" class="absolute top-4 right-4 bg-red-600 text-white px-3 py-1 rounded text-xs hidden shadow-lg z-50"></div>
    </main>

    <footer class="flex-shrink-0 bg-gray-900 border-t border-gray-800 z-20 h-24 flex flex-col">

        // --- LOAD SETTINGS ---
        let currentFontSize = localStorage.getItem('tvPlayerZoom') ? parseInt(localStorage.getItem('tvPlayerZoom')) : 16;
        document.documentElement.style.fontSize = currentFontSize + 'px';

        const savedCountry = localStorage.getItem('tvPlayerCountry') || 'tr';
        
        // Favorites
        try {
            favoriteChannels = JSON.parse(localStorage.getItem('tvPlayerFavorites')) || [];
        } catch(e) { favoriteChannels = []; }

        updateCountryDisplay(savedCountry);

        function updateCountryDisplay(code) {
            const country = countryList.find(c => c.code === code) || { name: code.toUpperCase(), flag: '🏳️' };
            document.getElementById('selectedCountryDisplay').innerHTML = `${country.flag} ${country.name}`;
        }
        
        function changeZoom(amount) {
            currentFontSize += amount;
            if (currentFontSize < 6) currentFontSize = 6;
            if (currentFontSize > 30) currentFontSize = 30;
            document.documentElement.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('tvPlayerZoom', currentFontSize);
        }

        const BASE_URL = "https://raw.githubusercontent.com/famelack/famelack-channels/main/channels/raw/countries/";

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
                else if (playerWrapper.webkitRequestFullscreen) playerWrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        
        // --- COUNTRY MENU FUNCTIONS ---
        function toggleCountryMenu() {
            if (countryOverlay.classList.contains('hidden')) {
                renderCountryGrid();
                countryOverlay.classList.remove('hidden');
            } else {
                countryOverlay.classList.add('hidden');
            }
        }

        function renderCountryGrid() {
            countryGrid.innerHTML = '';
            countryList.forEach(c => {
                const div = document.createElement('div');
                div.className = 'country-card';
                div.onclick = () => selectCountry(c.code);
                div.innerHTML = `
                    <div class="country-flag">${c.flag}</div>
                    <div class="country-name">${c.name}</div>
                `;
                countryGrid.appendChild(div);
            });
        }

        function selectCountry(code) {
            localStorage.setItem('tvPlayerCountry', code);
            updateCountryDisplay(code);
            fetchChannels(code);
            countryOverlay.classList.add('hidden');
        }

        // --- FAVORITE SYSTEM ---
        function toggleFavorite(channel, event) {
            event.stopPropagation();
            
            const index = favoriteChannels.findIndex(fav => fav.name === channel.name);
            if (index > -1) {
                favoriteChannels.splice(index, 1);
            } else {
                favoriteChannels.push(channel);
            }
            
            localStorage.setItem('tvPlayerFavorites', JSON.stringify(favoriteChannels));
            renderChannels(playableChannels); 
        }

        function isFavorite(channel) {
            return favoriteChannels.some(fav => fav.name === channel.name);
        }

        async function fetchChannels(countryCode) {
            channelListEl.innerHTML = `
                <div class="flex items-center justify-center h-full text-gray-500 w-full">
                    <i class="fas fa-circle-notch fa-spin text-2xl text-red-600 mb-3 mr-2"></i>
                    <span class="text-xs">Updating List...</span>
                </div>`;
            try {
                const response = await fetch(`${BASE_URL}${countryCode}.json`);
                if (!response.ok) throw new Error('Error');
                allChannels = await response.json();
                renderChannels(allChannels);
            } catch (error) {
                channelListEl.innerHTML = '<div class="p-4 text-center text-red-400 text-xs w-full">Failed to load list.</div>';
            }
        }

        function renderChannels(channels) {
            channelListEl.innerHTML = '';
            
            playableChannels = channels.filter(ch => 
                (ch.iptv_urls && ch.iptv_urls.length > 0) || 
                (ch.youtube_urls && ch.youtube_urls.length > 0)
            );
            
            channelCountEl.innerText = playableChannels.length;

            if (playableChannels.length === 0) {
                channelListEl.innerHTML = '<div class="p-4 text-center text-gray-500 text-xs w-full">No channels found.</div>';
                return;
            }

            // Separate Favorites
            const favs = playableChannels.filter(ch => isFavorite(ch));
            const others = playableChannels.filter(ch => !isFavorite(ch));

            // Favori Ayracı
            if (favs.length > 0) {
                favs.forEach((channel, index) => createChannelCard(channel, index, true));
                
                // Dikey çizgi (Ayraç)
                const separator = document.createElement('div');
                separator.className = "h-12 w-px bg-gray-700 mx-2";
                channelListEl.appendChild(separator);
            }

            others.forEach((channel, index) => createChannelCard(channel, index, false));
        }

        function createChannelCard(channel, index, isFavList) {
            const isIptv = channel.iptv_urls && channel.iptv_urls.length > 0;
            const div = document.createElement('div');
            const uniqueId = isFavList ? `fav-${index}` : `ch-${index}`;
            
            // YATAY KART TASARIMI
            div.className = `channel-item bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl cursor-pointer p-3 flex items-center shadow-lg group select-none`;
            div.id = uniqueId;
            div.onclick = () => playChannel(channel, div);
            
            const icon = isIptv 
                ? '<div class="w-8 h-8 rounded-full bg-gray-900 flex items-center justify-center mr-3 flex-shrink-0 border border-gray-600"><i class="fas fa-tv text-green-500 text-sm"></i></div>' 
                : '<div class="w-8 h-8 rounded-full bg-gray-900 flex items-center justify-center mr-3 flex-shrink-0 border border-gray-600"><i class="fab fa-youtube text-red-500 text-sm"></i></div>';
            
            const heartClass = isFavorite(channel) ? "fas fa-heart is-favorite" : "far fa-heart text-gray-600";
            
            div.innerHTML = `
                ${icon}
                <span class="font-bold truncate flex-1 text-sm text-gray-200 tracking-wide">${channel.name}</span>
                <i onclick="toggleFavorite(this.parentElement.channelData, event)" class="fav-btn ${heartClass} text-base ml-2 hover:text-red-400"></i>
            `;
            
            div.channelData = channel;
            channelListEl.appendChild(div);
        }

        function playChannel(channel, element) {
            document.querySelectorAll('.channel-item').forEach(el => {
                el.classList.remove('active-channel');
                el.classList.replace('bg-red-600', 'bg-gray-800');
            });
            
            if(element) {
                element.classList.add('active-channel');
                // Yatay kaydırma hizalaması
                element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            currentChannelTitle.innerHTML = `<span class="text-red-500 mr-2">LIVE:</span> ${channel.name}`;
            statusMessage.classList.add('hidden');
            if(placeholderContent) placeholderContent.style.display = 'none';

            const existingVideo = document.getElementById('hls-video');
            const existingIframe = document.querySelector('#playerWrapper iframe');
            if(existingVideo) existingVideo.remove();
            if(existingIframe) existingIframe.remove();
            
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }

            if (channel.iptv_urls && channel.iptv_urls.length > 0) {
                playHls(channel.iptv_urls[0]);
            } else if (channel.youtube_urls && channel.youtube_urls.length > 0) {
                playYoutube(channel.youtube_urls[0]);
            }
        }

        function playHls(url) {
            const video = document.createElement('video');
            video.id = "hls-video";
            video.className = "w-full h-full";
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            // Full width/height styling
            video.style.cssText = "object-fit: contain; width: 100%; height: 100%; background-color: black;";
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');

            playerWrapper.appendChild(video);

            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        function playYoutube(url) {
            let embedUrl = url;
            if (!url.includes('embed')) {
                const videoId = url.split('v=')[1] || url.split('/').pop();
                embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&showinfo=0&playsinline=1`;
            } else { embedUrl += "?autoplay=1&playsinline=1"; }
            
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.allow = "autoplay; encrypted-media; gyroscope; picture-in-picture";
            iframe.allowFullscreen = true;
            iframe.className = "w-full h-full border-none";
            playerWrapper.appendChild(iframe);
        }

        fetchChannels(savedCountry);
    </script>
</body>
</html>
